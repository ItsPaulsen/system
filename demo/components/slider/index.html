<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Slider — Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="stylesheet" href="/demo/tokens.css" />
    <link rel="stylesheet" href="/demo/components.css" />
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div class="wrap">
      <header class="site-head">
        <div class="site-head__body">
          <div class="site-head__title">
            <h1>Slider</h1>
          </div>
          <p class="lede">Pick a value from a range by dragging.</p>
        </div>
      </header>

      <div class="preview-grid">
        <section class="preview-block">
          <h3 class="subhead">Default</h3>
          <p class="section-note">
            A native <code>&lt;input type="range"&gt;</code> — keyboard (arrows / Home / End),
            steps, and min/max are all built in.
          </p>
          <div class="component-preview">
            <input class="slider" type="range" min="0" max="100" value="50" aria-label="Value" />
          </div>
        </section>

        <section class="preview-block">
          <h3 class="subhead">Stepped</h3>
          <p class="section-note"><code>step</code> snaps the thumb to fixed increments.</p>
          <div class="component-preview">
            <input
              class="slider"
              type="range"
              min="0"
              max="100"
              step="25"
              value="25"
              aria-label="Stepped value"
            />
          </div>
        </section>

        <section class="preview-block">
          <h3 class="subhead">Disabled</h3>
          <div class="component-preview">
            <input
              class="slider"
              type="range"
              min="0"
              max="100"
              value="40"
              disabled
              aria-label="Disabled value"
            />
          </div>
        </section>

        <section class="preview-block">
          <h3 class="subhead">Markup</h3>
          <pre><code><span class="tok-key">&lt;input</span> <span class="tok-prop">class</span>=<span class="tok-str">"slider"</span> <span class="tok-prop">type</span>=<span class="tok-str">"range"</span> <span class="tok-prop">min</span>=<span class="tok-str">"0"</span> <span class="tok-prop">max</span>=<span class="tok-str">"100"</span> <span class="tok-prop">value</span>=<span class="tok-str">"50"</span> <span class="tok-key">/&gt;</span></code></pre>
        </section>
      </div>
    </div>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
