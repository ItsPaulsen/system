name: Deploy to GitHub Pages

# The repo root is the site (static HTML/CSS/JS), so we upload it as-is and
# deploy via GitHub Actions — the modern path, replacing the legacy Jekyll
# builder whose deploy step was hanging in the queue.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate the deploy on lint so a failing push never publishes.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    # Static upload+deploy takes seconds; fail fast if a running job wedges so
    # it releases the Pages lock instead of hanging the queue.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
