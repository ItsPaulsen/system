<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Settings — Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="stylesheet" href="/demo/globals.css" />
    <link rel="stylesheet" href="/demo/components.css" />
    <link rel="stylesheet" href="/demo/example/example.css" />
    <link rel="stylesheet" href="/demo/example/settings/settings.css" />
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#ex-main">Skip to content</a>
    <div data-chrome="topbar"></div>

    <main class="ex settings-page" id="ex-main" tabindex="-1">
      <!-- Left-aligned hero: breadcrumb up one level to Home, then the page title. -->
      <header class="settings-hero">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <ol class="breadcrumb__list">
            <li class="breadcrumb__item">
              <a class="breadcrumb__link" href="/demo/example/">Home</a>
            </li>
            <li class="breadcrumb__item">
              <span class="breadcrumb__current" aria-current="page">Settings</span>
            </li>
          </ol>
        </nav>
        <a class="settings-back" href="/demo/example/" aria-label="Back to Home">
          <svg
            class="settings-back__icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M15 6l-6 6l6 6" />
          </svg>
          Home
        </a>
        <h1 class="settings-hero__title">Settings</h1>
      </header>

      <!-- Section cards — each links into a settings area. The whole card is the
           <a>, so a.card hover/active drives the surface; the icon badge reuses
           the secondary (primary-soft) recipe. -->
      <section class="settings-grid" aria-label="Settings sections">
        <a class="card settings-card" href="/demo/example/settings/about/">
          <span class="settings-card__icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
              <path d="M9 10a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" />
              <path d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855" />
            </svg>
          </span>
          <h2 class="settings-card__title">About you</h2>
          <svg
            class="settings-card__chevron"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 6l6 6l-6 6" />
          </svg>
          <p class="settings-card__desc">Show and edit your contact information</p>
        </a>

        <a class="card settings-card" href="/demo/example/settings/communication/">
          <span class="settings-card__icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 10.663c0 -4.224 -4.041 -7.663 -9 -7.663s-9 3.439 -9 7.663c0 3.783 3.201 6.958 7.527 7.56c1.053 .239 .932 .644 .696 2.133c-.039 .238 -.184 .932 .777 .512c.96 -.42 5.18 -3.201 7.073 -5.48c1.304 -1.504 1.927 -3.029 1.927 -4.715v-.01"
              />
            </svg>
          </span>
          <h2 class="settings-card__title">Communication</h2>
          <svg
            class="settings-card__chevron"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 6l6 6l-6 6" />
          </svg>
          <p class="settings-card__desc">Show and edit how we communicate with you</p>
        </a>

        <a class="card settings-card" href="/demo/example/settings/privacy/">
          <span class="settings-card__icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 21a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3c.568 1.933 .635 3.957 .223 5.89"
              />
              <path d="M17.001 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
              <path d="M19.001 15.5v1.5" />
              <path d="M19.001 21v1.5" />
              <path d="M22.032 17.25l-1.299 .75" />
              <path d="M17.27 20l-1.3 .75" />
              <path d="M15.97 17.25l1.3 .75" />
              <path d="M20.733 20l1.3 .75" />
            </svg>
          </span>
          <h2 class="settings-card__title">Privacy and security</h2>
          <svg
            class="settings-card__chevron"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M9 6l6 6l-6 6" />
          </svg>
          <p class="settings-card__desc">Show and edit your privacy and security settings</p>
        </a>
      </section>
    </main>

    <div data-chrome="footer"></div>

    <div data-chrome="menu"></div>

    <div data-chrome="grid-overlay"></div>

    <script src="/demo/example/chrome.js" defer></script>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
