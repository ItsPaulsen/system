<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Switch — Demo</title>
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="stylesheet" href="/demo/tokens.css" />
    <link rel="stylesheet" href="/demo/components.css" />
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div class="wrap">
      <header class="site-head">
        <div class="site-head__body">
          <div class="site-head__title">
            <h1>Switch</h1>
          </div>
          <p class="lede">A binary on/off control.</p>
        </div>
      </header>

      <div class="preview-grid">
        <section class="preview-block">
          <h3 class="subhead">Default</h3>
          <div class="component-preview">
            <label class="switch">
              <span class="switch__input-wrapper">
                <input type="checkbox" class="switch__input" />
                <span class="switch__knob"></span>
              </span>
              <span class="switch__label">Notifications</span>
            </label>
          </div>
        </section>

        <section class="preview-block">
          <h3 class="subhead">Disabled</h3>
          <div class="component-preview">
            <label class="switch">
              <span class="switch__input-wrapper">
                <input type="checkbox" class="switch__input" disabled />
                <span class="switch__knob"></span>
              </span>
              <span class="switch__label">Notifications</span>
            </label>
          </div>
        </section>

        <section class="preview-block">
          <h3 class="subhead">Markup</h3>
          <pre><code><span class="tok-key">&lt;label</span> <span class="tok-prop">class</span>=<span class="tok-str">"switch"</span><span class="tok-key">&gt;</span>
  <span class="tok-key">&lt;span</span> <span class="tok-prop">class</span>=<span class="tok-str">"switch__input-wrapper"</span><span class="tok-key">&gt;</span>
    <span class="tok-key">&lt;input</span> <span class="tok-prop">type</span>=<span class="tok-str">"checkbox"</span> <span class="tok-prop">class</span>=<span class="tok-str">"switch__input"</span> <span class="tok-key">/&gt;</span>
    <span class="tok-key">&lt;span</span> <span class="tok-prop">class</span>=<span class="tok-str">"switch__knob"</span><span class="tok-key">&gt;&lt;/span&gt;</span>
  <span class="tok-key">&lt;/span&gt;</span>
  <span class="tok-key">&lt;span</span> <span class="tok-prop">class</span>=<span class="tok-str">"switch__label"</span><span class="tok-key">&gt;</span>Notifications<span class="tok-key">&lt;/span&gt;</span>
<span class="tok-key">&lt;/label&gt;</span></code></pre>
        </section>
      </div>
    </div>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
