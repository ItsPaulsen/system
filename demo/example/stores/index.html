  <body class="stores-body">
    <a class="skip-link" href="#stores-panel">Skip to content</a>
    <div data-chrome="topbar"></div>

    <!-- Store finder: one map filling the viewport and one panel of stores over
         it. The panel comes first in source so the keyboard reaches the search
         and the store list before the map's pins; both are positioned, so the
         order costs the layout nothing.

         From 1024 the panel is a rail flush to the left edge. Below it the same
         panel is a bottom sheet over a map that shrinks to a peek strip. The
         page has no footer at either width: nothing scrolls, so there would be
         no way to reach one. -->
    <main class="ex stores-page" id="ex-main" tabindex="-1">
      <h1 class="sr-only">Stores</h1>

      <!-- data-mode is the panel's one state: regions (browse), results
           (a search is active) or detail (a store is open). Everything the
           three views differ by is a CSS rule on that attribute, so no view
           is built or torn down. -->
      <section
        class="stores-panel"
        id="stores-panel"
        data-stores-panel
        data-mode="regions"
        tabindex="-1"
        aria-label="Find a store"
      >
        <!-- Drag handle: a pointer affordance, not a control. It is out of the
             tab order and hidden from AT because it opens nothing the keyboard
             can't already reach, the list scrolls at any snap and focusing the
             search opens the sheet. A button here only put a focus ring around
             the whole sheet. -->
        <div class="stores-panel__grab" data-stores-grab aria-hidden="true">
          <span class="stores-panel__grab-bar"></span>
        </div>

        <div class="stores-panel__body" data-scroll-area>
          <div class="scroll-area__viewport stores-panel__scroll">
            <!-- Title, search and filters as one box, on the surface the region
                 accordions use. -->
            <div class="stores-head">
              <h2 class="stores-panel__title">Find a store</h2>

              <div class="input stores-search">
                <label class="input__label sr-only" for="stores-search"
                  >Search for a place or store name</label
                >
                <span class="input__container input__container--rounded">
                  <span class="input__leading">
                    <svg
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <path d="M3 10a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" />
                      <path d="M21 21l-6 -6" />
                    </svg>
                  </span>
                  <input
                    id="stores-search"
                    name="stores-search"
                    class="input__element"
                    type="search"
                    placeholder="Search for a place or store name"
                    autocomplete="off"
                    data-stores-search
                  />
                </span>
              </div>

              <div class="stores-filters" data-size="sm">
                <label class="chip chip--as-checkbox">
                  <input
                    name="stores-nearest"
                    type="checkbox"
                    class="chip__input"
                    data-stores-nearest
                  />
                  Near me
                </label>
                <label class="chip chip--as-checkbox">
                  <input name="stores-open" type="checkbox" class="chip__input" data-stores-open />
                  Open now
                </label>
              </div>
            </div>

            <!-- Live count, only printed once a search or filter has narrowed the
                 set. aria-live so a result count that changes under the cursor is
                 announced without moving focus. -->
            <p class="stores-panel__count" data-stores-count aria-live="polite" role="status"></p>

            <!-- Browse view. Cards live here until a search or filter moves them
                 into the flat list below. -->

                            stroke-linejoin="round"
                            aria-hidden="true"
                          >
                            <path d="M9 6l6 6l-6 6" />
                          </svg>
                        </span>
                      </button>
                    </li>
                    <li>
                      <button
                        class="card stores-card"
                        type="button"
                        data-store="riverside"
                        data-lat="59.935"
                        data-lng="10.657"
                        data-type="standard"
                        data-type-label="Standard"
                        data-open="true"
                        data-distance="7.9"
                        data-city="Riverside"
                        data-phone="900 12 357"
                        data-email="riverside@demo.example"
                        data-site="demo.example/riverside"
                        data-hours-weekday="10:00 - 19:00"
                        data-hours-sat="10:00 - 17:00"
                        data-hours-sun="Closed"
                      >
                        <span class="stores-card__content">
                          <span class="stores-card__name">Demo Riverside</span>
                          <span class="stores-card__address">Riverside Path 6</span>
                          <span class="stores-card__status">
                            <span class="stores-card__state stores-card__state--open">Open</span>
                            <span aria-hidden="true">·</span>
                            Closes 19:00
                          </span>
                        </span>
                        <span class="stores-card__action" aria-hidden="true">
                          <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                          >
                            <path d="M9 6l6 6l-6 6" />
                          </svg>
                        </span>
                      </button>
                    </li>
                    <li>
                      <button
                        class="card stores-card"
                        type="button"
                        data-store="greenfield"
                        data-lat="59.9012"
                        data-lng="10.642"
                        data-type="pickup"
                        data-type-label="Pickup point"
                        data-open="false"
                        data-distance="9.6"
                        data-city="Greenfield"
                        data-phone="900 12 358"
                        data-email="greenfield@demo.example"
                        data-site="demo.example/greenfield"
                        data-hours-weekday="08:00 - 16:00"
                        data-hours-sat="Closed"
                        data-hours-sun="Closed"
                      >
                        <span class="stores-card__content">
                          <span class="stores-card__name">Demo Greenfield</span>
                          <span class="stores-card__address">Greenfield Court 14</span>
                          <span class="stores-card__status">
                            <span class="stores-card__state">Closed</span>
                            <span aria-hidden="true">·</span>
                            Opens Tue 08:00
                          </span>
                        </span>
                        <span class="stores-card__action" aria-hidden="true">
                          <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            aria-hidden="true"
                          >
                            <path d="M9 6l6 6l-6 6" />
                          </svg>
                        </span>
                      </button>
                    </li>
                  </ul>
                </div>
              </details>
            </div>

            <!-- Flat result list. Cards are moved here from their region while a
                 search or filter is on, and moved back when it clears: one list
                 with one gap, and an order that can actually be sorted across
                 regions. -->
            <ul class="stores-list stores-results" data-stores-results hidden></ul>

            <!-- Shown when search + filters match nothing. -->
            <div class="empty stores-empty" data-stores-empty hidden>
              <h3 class="empty__title">No stores here</h3>
              <p class="empty__text">Try a different place, or clear the filters.</p>
            </div>
          </div>
          <div class="scroll-area__bar" aria-hidden="true">
            <div class="scroll-area__thumb"></div>
          </div>
        </div>

        <!-- Detail view. One node, filled from the card's data attributes, so
             the panel never holds fourteen copies of this. -->
        <div class="stores-detail" data-stores-detail hidden>
          <div class="stores-detail__scroll" data-stores-detail-scroll>
            <button class="link stores-detail__back" type="button" data-stores-back>
              <svg
                viewBox="0 0 24 24"
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M5 12l14 0" />
                <path d="M5 12l6 6" />
                <path d="M5 12l6 -6" />
              </svg>
              Back
            </button>

            <h2 class="stores-detail__name" data-detail-name tabindex="-1">Store</h2>
            <p class="stores-detail__address" data-detail-address></p>
            <p class="stores-detail__type" data-detail-type></p>

            <details class="stores-detail__hours">
              <summary class="stores-detail__hours-summary">
                <span class="stores-detail__hours-label">Opening hours</span>
                <span class="stores-detail__hours-now" data-detail-status></span>
                <svg
                  class="stores-detail__hours-chevron"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M6 9l6 6l6 -6" />
                </svg>
              </summary>
              <dl class="stores-detail__hours-list" data-detail-hours></dl>
            </details>

            <dl class="stores-detail__rows">
              <div class="stores-detail__row">
                <dt>Website</dt>
                <dd><a class="link" href="/demo/example/" data-detail-site></a></dd>
              </div>
              <div class="stores-detail__row">
                <dt>Phone</dt>
                <dd><a class="link" href="#" data-detail-phone></a></dd>
              </div>
              <div class="stores-detail__row">
                <dt>E-mail</dt>
                <dd><a class="link" href="#" data-detail-email></a></dd>
              </div>
            </dl>

            <a class="button button--primary stores-detail__cta" href="/demo/example/shop/">
              See what's in stock
            </a>
          </div>
        </div>
      </section>

      <div class="stores-map">
        <!-- Leaflet writes its tiles and markers in here. role="application"
             because the pannable map is a widget, not a document region. -->
        <div
          class="stores-map__canvas"
          id="stores-map"
          role="application"
          aria-label="Map of stores"
        ></div>

        <!-- Our own zoom pair, so the control is the Button component rather
             than Leaflet's default chrome (stores.js disables that one). -->
        <div class="stores-map__zoom" data-size="sm">
          <button
            class="button button--secondary button--icon stores-map__zoom-button"
            type="button"
            data-stores-zoom="in"
            aria-label="Zoom in"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 5l0 14" />
              <path d="M5 12l14 0" />
            </svg>
          </button>
          <button
            class="button button--secondary button--icon stores-map__zoom-button"
            type="button"
            data-stores-zoom="out"
            aria-label="Zoom out"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12l14 0" />
            </svg>
          </button>
        </div>
      </div>
    </main>

    <!-- No footer on this page at any width: the map fills the viewport, so there
         is no page scroll to reach one with. See stores.css. -->
    <div data-chrome="menu"></div>

    <div data-chrome="grid-overlay"></div>

    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
      integrity="sha384-NElt3Op+9NBMCYaef5HxeJmU4Xeard/Lku8ek6hoPTvYkQPh3zLIrJP7KiRocsxO"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
      defer
    ></script>
    <script src="/demo/example/chrome.js" defer></script>
    <script src="/assets/app.js" defer></script>
    <script src="/demo/example/stores/stores.js" defer></script>
  </body>
</html>
