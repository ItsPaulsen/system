name: Lint

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes older lint runs — cancel them
# so rapid pushes don't queue a stack of stale runs (and stale failure emails).
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
