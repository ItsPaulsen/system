<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Shadows - Demo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/assets/base.css" />
    <link rel="stylesheet" href="/demo/globals.css" />
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <main class="wrap">
      <header class="site-head">
        <div class="site-head__body">
          <div class="site-head__title">
            <h1>Shadows</h1>
          </div>
          <p class="lede">Elevation depth scale.</p>
        </div>
      </header>

      <div class="preview-grid">
        <section class="preview-block">
          <h2 class="subhead">Small</h2>
          <p class="section-note">Cards resting on the page.</p>
          <article class="preview-card" data-token="shadow-sm">
            <span class="preview-card__name"><code>shadow-sm</code></span>
            <div class="preview-card__demo">
              <span class="preview-card__chip" data-shadow-demo></span>
            </div>
            <div class="preview-card__meta">
              <div class="preview-card__meta-text">
                <span class="preview-card__value"></span>
              </div>
            </div>
          </article>
        </section>

        <section class="preview-block">
          <h2 class="subhead">Medium</h2>
          <p class="section-note">Menus, dropdowns, popovers.</p>
          <article class="preview-card" data-token="shadow-md">
            <span class="preview-card__name"><code>shadow-md</code></span>
            <div class="preview-card__demo">
              <span class="preview-card__chip" data-shadow-demo></span>
            </div>
            <div class="preview-card__meta">
              <div class="preview-card__meta-text">
                <span class="preview-card__value"></span>
              </div>
            </div>
          </article>
        </section>

        <section class="preview-block">
          <h2 class="subhead">Large</h2>
          <p class="section-note">Modals, drawers, overlays.</p>
          <article class="preview-card" data-token="shadow-lg">
            <span class="preview-card__name"><code>shadow-lg</code></span>
            <div class="preview-card__demo">
              <span class="preview-card__chip" data-shadow-demo></span>
            </div>
            <div class="preview-card__meta">
              <div class="preview-card__meta-text">
                <span class="preview-card__value"></span>
              </div>
            </div>
          </article>
        </section>
      </div>
    </main>
    <script src="/assets/app.js" defer></script>
  </body>
</html>
